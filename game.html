<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meteor Dodge — 60 seconds</title>
<style>
  html, body { margin: 0; padding: 0; background: #070714; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// Meteor Dodge — the tiny game from one prompt:
// "a tiny browser game: dodge the falling meteors, collect stars, 60 seconds"
// Player: a little rocket. Move with mouse or arrow keys. Demo mode (?demo=1)
// steers itself so the game can be watched hands-free.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';
const DURATION = 60;

const player = { x: 0, y: 0, r: 22, vx: 0, lives: 3, inv: 0 };
player.x = W / 2; player.y = H - 90;
let meteors = [], stars = [], parts = [];
let score = 0, collected = 0, dodged = 0;
let timeLeft = DURATION, over = false, started = performance.now(), last = started;
let spawnT = 0, starT = 0;

function rand(a, b) { return a + Math.random() * (b - a); }
function spawnMeteor() {
  meteors.push({ x: rand(30, W - 30), y: -30, r: rand(14, 30), vy: rand(180, 380), rot: rand(0, 6.28), vr: rand(-1.5, 1.5) });
}
function spawnStar() {
  stars.push({ x: rand(30, W - 30), y: -20, r: 14, vy: rand(120, 200), tw: rand(0, 6.28) });
}

let mouseX = null;
window.addEventListener('mousemove', e => { mouseX = e.clientX; });
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function steer(dt) {
  // Demo autopilot: chase the nearest star, swerve away from close meteors.
  if (DEMO) {
    let target = W / 2;
    if (stars.length) {
      let best = stars[0];
      for (const s of stars) if (s.y > best.y) best = s;
      target = best.x;
    }
    for (const m of meteors) {
      if (m.y > player.y - 260 && m.y < player.y && Math.abs(m.x - player.x) < 90) {
        target = m.x < player.x ? player.x + 160 : player.x - 160;
      }
    }
    const dx = target - player.x;
    player.x += Math.max(-520 * dt, Math.min(520 * dt, dx));
  } else {
    if (mouseX !== null) player.x += (mouseX - player.x) * Math.min(1, dt * 12);
    if (keys['ArrowLeft'] || keys['a']) player.x -= 520 * dt;
    if (keys['ArrowRight'] || keys['d']) player.x += 520 * dt;
  }
  player.x = Math.max(30, Math.min(W - 30, player.x));
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-160, 160), vy: rand(-160, 160), life: rand(0.3, 0.7), color });
}

function update(dt) {
  if (over) return;
  player.y = H - 90; // stay glued near the bottom even if the viewport resizes
  timeLeft = Math.max(0, DURATION - (performance.now() - started) / 1000);
  if (timeLeft <= 0) { over = true; return; }
  steer(dt);
  spawnT -= dt; starT -= dt;
  if (spawnT <= 0) { spawnMeteor(); spawnT = rand(0.25, 0.6); }
  if (starT <= 0) { spawnStar(); starT = rand(0.8, 1.6); }
  if (player.inv > 0) player.inv -= dt;
  for (const m of meteors) { m.y += m.vy * dt; m.rot += m.vr * dt; if (m.y > H + 40) { dodged++; score += 5; } }
  meteors = meteors.filter(m => m.y < H + 40);
  for (const s of stars) { s.y += s.vy * dt; s.tw += dt * 5; }
  stars = stars.filter(s => s.y < H + 40);
  for (const s of stars) {
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    if (d < s.r + player.r) { collected++; score += 50; burst(s.x, s.y, '#ffd34d', 14); s.y = H + 999; }
  }
  stars = stars.filter(s => s.y < H + 40);
  for (const m of meteors) {
    const d = Math.hypot(m.x - player.x, m.y - player.y);
    if (d < m.r + player.r - 6 && player.inv <= 0) {
      player.lives--; player.inv = 2; burst(player.x, player.y, '#ff5a5a', 22);
      if (player.lives <= 0) { over = true; }
    }
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}

function drawRocket(x, y) {
  ctx.save(); ctx.translate(x, y);
  if (player.inv > 0 && Math.floor(performance.now() / 120) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ff8a3d';
  ctx.beginPath(); ctx.moveTo(-9, 14); ctx.lineTo(0, 30 + Math.random() * 10); ctx.lineTo(9, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8ecf4';
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.quadraticCurveTo(15, -6, 12, 14); ctx.lineTo(-12, 14); ctx.quadraticCurveTo(-15, -6, 0, -26); ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.arc(0, -4, 6, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ff5a5a';
  ctx.fillRect(-18, 8, 6, 10); ctx.fillRect(12, 8, 6, 10);
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
  ctx.fillStyle = '#8a6f5c';
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * 6.28, r = m.r * (0.8 + 0.25 * Math.sin(i * 2.7));
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5d483a';
  ctx.beginPath(); ctx.arc(-m.r * 0.3, -m.r * 0.2, m.r * 0.25, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(m.r * 0.35, m.r * 0.3, m.r * 0.18, 0, 6.29); ctx.fill();
  ctx.restore();
}

function drawStar(s) {
  ctx.save(); ctx.translate(s.x, s.y);
  const tw = 0.7 + 0.3 * Math.sin(s.tw);
  ctx.globalAlpha = tw; ctx.fillStyle = '#ffd34d';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * 6.28 - 1.57, r = i % 2 === 0 ? s.r : s.r * 0.45;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function draw() {
  ctx.fillStyle = '#070714'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 90; i++) {
    const sx = (i * 137.5) % W, sy = (i * 89.3) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }
  for (const s of stars) drawStar(s);
  for (const m of meteors) drawMeteor(m);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); }
  ctx.globalAlpha = 1;
  drawRocket(player.x, player.y);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('⭐ ' + collected + '   SCORE ' + score, 24, 44);
  ctx.textAlign = 'center';
  ctx.fillStyle = timeLeft <= 10 ? '#ff5a5a' : '#ffffff';
  ctx.fillText('⏱ ' + Math.ceil(timeLeft) + 's', W / 2, 44);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff';
  ctx.fillText('♥'.repeat(Math.max(0, player.lives)) + '♡'.repeat(Math.max(0, 3 - player.lives)), W - 24, 44);
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('METEOR DODGE — dodge the rocks, grab the stars', W / 2, H - 24);
  if (over) {
    ctx.fillStyle = 'rgba(7,7,20,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 72px sans-serif';
    ctx.fillText(player.lives <= 0 ? 'GAME OVER' : 'TIME UP!', W / 2, H / 2 - 20);
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = '#ffd34d';
    ctx.fillText('⭐ ' + collected + ' stars   •   SCORE ' + score, W / 2, H / 2 + 50);
    ctx.font = '28px sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText('Built from one prompt by an AI agent', W / 2, H / 2 + 110);
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
// Small read-only hook so a test harness can ask how the game is doing.
window.__meteorDodge = {
  score: () => score, stars: () => collected, lives: () => player.lives,
  timeLeft: () => timeLeft, over: () => over,
};
requestAnimationFrame(frame);
</script>
</body>
</html>
